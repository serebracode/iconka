name: Prepare Icon Assets

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug to process, or 'all' for every complete set in source-action"
        required: true
        default: "all"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Prepare assets
        run: python scripts/prepare_icon_assets.py --slug "${{ inputs.slug }}"

      - name: Show generated files
        run: git status --short

      - name: Commit generated assets to main
        run: |
          if [ -z "$(git status --porcelain -- icons/ data/icons.json)" ]; then
            echo "No generated asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/ data/icons.json
          git commit -m "Prepare Iconka image assets"

          # main may have advanced while image processing was running.
          # Rebase the generated commit on the latest main, then push.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Generated assets committed to main."
