name: Build Android flame asset

on:
  push:
    branches:
      - fix/android-flame-webp
    paths:
      - '.github/workflows/build-android-flame.yml'
      - 'video/OgonALpha.webm'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-flame-webp

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build cropped transparent animated WebP
        run: |
          ffmpeg -y -i video/OgonALpha.webm \
            -vf "crop=135:150:475:1010,fps=20" \
            -an -c:v libwebp -q:v 86 -compression_level 6 -loop 0 \
            video/OgonAlpha.android.webp
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,duration \
            -of default=noprint_wrappers=1 video/OgonAlpha.android.webp

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/OgonAlpha.android.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build Android transparent flame asset"
          git push origin HEAD:fix/android-flame-webp
